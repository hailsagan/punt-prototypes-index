<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punt — Prototypes</title>
<style>
  :root {
    --bg: #0a0a0a;
    --card-bg: #131313;
    --card-border: #232323;
    --card-border-hover: #3a3a3a;
    --text: #f5f5f5;
    --text-dim: #9a9a9a;
    --text-faint: #5f5f5f;
    --accent: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 80px 24px 64px;
  }

  header {
    margin-bottom: 56px;
  }

  .wordmark {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
  }

  header p {
    font-size: 15px;
    color: var(--text-dim);
    margin: 0;
    max-width: 520px;
    line-height: 1.5;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 16px;
  }

  .card {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 24px;
    text-decoration: none;
    color: var(--text);
    min-height: 180px;
    transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
  }

  .card:hover {
    border-color: var(--card-border-hover);
    background: #171717;
    transform: translateY(-2px);
  }

  .card-title {
    font-size: 18px;
    font-weight: 600;
    line-height: 1.3;
    margin: 0;
  }

  .card-footer {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 20px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
  }

  .card:hover .card-footer {
    color: var(--text);
  }

  .arrow {
    transition: transform 0.15s ease;
  }

  .card:hover .arrow {
    transform: translateX(3px);
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="wordmark">PUNT</div>
    <h1>Prototypes</h1>
    <p>A set of exploratory concepts. Select a prototype below to open it.</p>
  </header>

  <div class="grid">
    <a class="card" href="https://punt-xrm-001-wuea.vercel.app/">
      <div>
        <h2 class="card-title">XRM-001</h2>
      </div>
      <div class="card-footer">Open prototype <span class="arrow">&rarr;</span></div>
    </a>

    <a class="card" href="https://punt-ply-001.vercel.app/">
      <div>
        <h2 class="card-title">PLY-001</h2>
      </div>
      <div class="card-footer">Open prototype <span class="arrow">&rarr;</span></div>
    </a>

    <a class="card" href="https://punt-pre-002.vercel.app/">
      <div>
        <h2 class="card-title">PRE-002</h2>
      </div>
      <div class="card-footer">Open prototype <span class="arrow">&rarr;</span></div>
    </a>

    <a class="card" href="https://punt-explorations.vercel.app/adaptive-discovery/">
      <div>
        <h2 class="card-title">Adaptive Discovery</h2>
      </div>
      <div class="card-footer">Open prototype <span class="arrow">&rarr;</span></div>
    </a>
  </div>

</main>
</body>
</html>
